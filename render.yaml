databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
services:
  - type: web
    name: taskflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:setup
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
